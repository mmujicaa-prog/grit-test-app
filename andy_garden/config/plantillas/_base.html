<!-- Envoltorio comun de todos los correos. Estilos en linea porque los
     clientes de correo ignoran las hojas de estilo. No lleva imagenes
     externas: evita el aviso de "mostrar contenido remoto". -->
<div style="margin:0;padding:0;background:#f4f5f7">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f4f5f7;padding:24px 12px">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0"
               style="max-width:620px;background:#ffffff;border-radius:10px;border:1px solid #e3e6ea">
          <tr>
            <td style="padding:22px 28px;border-bottom:2px solid #2f6f4f">
              <div style="font:600 17px/1.3 Georgia,'Times New Roman',serif;color:#1f2733">Andy Garden</div>
              <div style="font:400 12px/1.4 Arial,Helvetica,sans-serif;color:#6b7280;letter-spacing:.05em;text-transform:uppercase;margin-top:3px">
                Comunicación a inversores
              </div>
            </td>
          </tr>
          <tr>
            <td style="padding:26px 28px;font:400 15px/1.65 Arial,Helvetica,sans-serif;color:#28313d">
{{contenido}}
{{firma}}
            </td>
          </tr>
          <tr>
            <td style="padding:14px 28px 20px;border-top:1px solid #eceef1;font:400 11px/1.5 Arial,Helvetica,sans-serif;color:#8a919c">
              Comunicación dirigida exclusivamente a {{nombre}}. Contiene información confidencial del proyecto Andy Garden.
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</div>
